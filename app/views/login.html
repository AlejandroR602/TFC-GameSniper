<!-- ============================================================
     VIEW: Login  |  GameSniper
     Vista pura HTML. AuthController.js gestiona el envío.
     ============================================================ -->

<section class="auth-section section">
    <div class="container">
        <div class="auth-card">

            <div class="auth-card__header">
                <div class="auth-card__icon"></div>
                <h1>Bienvenido de nuevo</h1>
                <p>Inicia sesión para acceder a tu wishlist e historial</p>
            </div>

            <!-- Mensajes de error / éxito (poblados por JS) -->
            <div id="loginAlert" hidden></div>

            <div class="auth-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-password">
                        <input
                            type="password"
                            id="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-pass" id="toggleLoginPass" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>

                <button type="button" id="loginBtn" class="btn btn-primary btn-block">
                    Iniciar sesión
                </button>
            </div>

            <p class="auth-card__footer">
                ¿No tienes cuenta? <a id="registerLink" href="#">Regístrate gratis</a>
            </p>
        </div>
    </div>
</section>

<script type="module">
import { AuthController } from './js/controllers/auth.js';
new AuthController('login').init();
</script>
